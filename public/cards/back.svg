<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 167 243" width="167" height="243">
  <defs>
    <linearGradient id="lapis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3b7a"/>
      <stop offset="1" stop-color="#0c1d45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dc8a"/>
      <stop offset="0.5" stop-color="#d4a638"/>
      <stop offset="1" stop-color="#a87b1f"/>
    </linearGradient>
    <!-- girih: eight-pointed stars and crosses -->
    <pattern id="girih" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="none"/>
      <g fill="none" stroke="#d4a638" stroke-width="0.9" opacity="0.55">
        <polygon points="14,2 17.5,10.5 26,14 17.5,17.5 14,26 10.5,17.5 2,14 10.5,10.5"/>
        <rect x="8.3" y="8.3" width="11.4" height="11.4" transform="rotate(45 14 14)"/>
        <rect x="8.3" y="8.3" width="11.4" height="11.4"/>
      </g>
      <circle cx="14" cy="14" r="1.6" fill="#2bb3a3" opacity="0.9"/>
      <g fill="#2bb3a3" opacity="0.5">
        <circle cx="0" cy="0" r="1.2"/><circle cx="28" cy="0" r="1.2"/>
        <circle cx="0" cy="28" r="1.2"/><circle cx="28" cy="28" r="1.2"/>
      </g>
    </pattern>
  </defs>

  <rect width="167" height="243" rx="10" fill="url(#lapis)"/>
  <rect x="7" y="7" width="153" height="229" rx="7" fill="url(#girih)"/>

  <!-- double gold frame -->
  <rect x="7" y="7" width="153" height="229" rx="7" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <rect x="12" y="12" width="143" height="219" rx="5" fill="none" stroke="#d4a638" stroke-width="0.7" opacity="0.8"/>

  <!-- central medallion -->
  <g transform="translate(83.5 121.5)">
    <circle r="36" fill="#0c1d45" stroke="url(#gold)" stroke-width="2"/>
    <circle r="31" fill="none" stroke="#2bb3a3" stroke-width="0.8" opacity="0.8"/>
    <!-- eight-pointed star -->
    <g fill="url(#gold)" stroke="#f4dc8a" stroke-width="0.4">
      <rect x="-20" y="-20" width="40" height="40"/>
      <rect x="-20" y="-20" width="40" height="40" transform="rotate(45)"/>
    </g>
    <g fill="#142b5c">
      <rect x="-13" y="-13" width="26" height="26"/>
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)"/>
    </g>
    <!-- 12-petal rosette -->
    <g fill="#2bb3a3" opacity="0.95">
      <ellipse rx="2.6" ry="8" cy="-8" />
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(30)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(60)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(90)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(120)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(150)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(180)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(210)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(240)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(270)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(300)"/>
      <ellipse rx="2.6" ry="8" cy="-8" transform="rotate(330)"/>
    </g>
    <circle r="4" fill="url(#gold)"/>
  </g>

  <!-- corner palmettes -->
  <g fill="#d4a638" opacity="0.9">
    <g transform="translate(22 22)">
      <path d="M0 -8 C 3 -4 3 0 0 4 C -3 0 -3 -4 0 -8Z"/>
      <path d="M-7 -3 C -3 -3 -1 0 -1 3 C -4 3 -7 1 -7 -3Z"/>
      <path d="M7 -3 C 3 -3 1 0 1 3 C 4 3 7 1 7 -3Z"/>
    </g>
    <g transform="translate(145 22) rotate(90)">
      <path d="M0 -8 C 3 -4 3 0 0 4 C -3 0 -3 -4 0 -8Z"/>
      <path d="M-7 -3 C -3 -3 -1 0 -1 3 C -4 3 -7 1 -7 -3Z"/>
      <path d="M7 -3 C 3 -3 1 0 1 3 C 4 3 7 1 7 -3Z"/>
    </g>
    <g transform="translate(145 221) rotate(180)">
      <path d="M0 -8 C 3 -4 3 0 0 4 C -3 0 -3 -4 0 -8Z"/>
      <path d="M-7 -3 C -3 -3 -1 0 -1 3 C -4 3 -7 1 -7 -3Z"/>
      <path d="M7 -3 C 3 -3 1 0 1 3 C 4 3 7 1 7 -3Z"/>
    </g>
    <g transform="translate(22 221) rotate(270)">
      <path d="M0 -8 C 3 -4 3 0 0 4 C -3 0 -3 -4 0 -8Z"/>
      <path d="M-7 -3 C -3 -3 -1 0 -1 3 C -4 3 -7 1 -7 -3Z"/>
      <path d="M7 -3 C 3 -3 1 0 1 3 C 4 3 7 1 7 -3Z"/>
    </g>
  </g>
</svg>
