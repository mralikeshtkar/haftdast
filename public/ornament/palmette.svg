<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 24" width="48" height="24">
  <!-- Achaemenid lotus-and-palmette frieze, one repeating unit -->
  <g fill="none" stroke="#d4a638" stroke-width="1.1" stroke-linecap="round">
    <!-- palmette fan -->
    <path d="M24 20 C 24 12 24 8 24 3"/>
    <path d="M24 20 C 22 13 18 9 14 7"/>
    <path d="M24 20 C 26 13 30 9 34 7"/>
    <path d="M24 20 C 20 15 16 13 11 13"/>
    <path d="M24 20 C 28 15 32 13 37 13"/>
    <!-- volutes -->
    <path d="M14 7 C 11 6 9 8 10 10 C 11 12 14 11 13 9"/>
    <path d="M34 7 C 37 6 39 8 38 10 C 37 12 34 11 35 9"/>
    <!-- connecting arcs to neighbours -->
    <path d="M0 20 C 6 20 10 16 11 13"/>
    <path d="M48 20 C 42 20 38 16 37 13"/>
  </g>
  <circle cx="24" cy="3" r="1.4" fill="#2bb3a3"/>
  <circle cx="0" cy="20" r="1.3" fill="#d4a638"/>
  <circle cx="48" cy="20" r="1.3" fill="#d4a638"/>
</svg>
