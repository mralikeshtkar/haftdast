# Render blueprint: one free web service running the custom Next.js + Socket.IO server.
# Deploy: push this repo to GitHub, then on render.com choose "New +" -> "Blueprint" and pick the repo.
services:
  - type: web
    name: haftdast
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production would make npm skip devDependencies, but the build needs them
    # (Tailwind, TypeScript), so install them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /fa
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
